[project]

name = "climrrgpt"
description = ""
authors = [{ name = "Yangxinyu", email = "xinyux@wharton.upenn.edu" }]
readme = "README.md"
dynamic = ["version"]
dependencies = ["st-pages>=1.0.1,<2"]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel", "pip>=24.3.1,<27", "setuptools>=75.1.0,<83"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.dynamic]
version = { attr = "src.version.__version__" }

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
climrrgpt = { path = ".", editable = true }
usearch = ">=2.23.0, <3"
globus-sdk = ">=4.5.0, <5"
python-dotenv = ">=1.2.2, <2"
deepagents = ">=0.4.12, <0.5"
langchain-openai = ">=1.1.12, <2"

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"
openai = ">=2.30.0,<3"
pytorch = ">=2.10.0,<3"
geopandas = ">=1.1.3,<2"
streamlit = ">=1.55.0,<2"
geopy = ">=2.4.1,<3"
plotly = ">=6.6.0,<7"
matplotlib = ">=3.10.8,<4"
rouge = ">=1.0.1,<2"
shapely = ">=2.1.2,<3"
census = ">=0.8.25,<0.9"
folium = ">=0.20.0,<0.21"
ollama = ">=0.19.0,<0.20"
contextily = ">=1.7.0,<2"
pip = ">=26.0.1,<27"
ollama-python = ">=0.6.1,<0.7"
streamlit-folium = ">=0.27.1,<0.28"
sentence-transformers = ">=5.3.0,<6"
numpy = ">=2.4.3,<3"
uv = ">=0.11.2,<0.12"
faiss-cpu = ">=1.10.0,<2"
rank-bm25 = ">=0.2.2,<0.3"
langchain-ollama = ">=1.0.1,<2"
docker-compose = ">=5.1.1,<6"
