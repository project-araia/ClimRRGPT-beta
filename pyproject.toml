[project]

name = "climrrgpt"
description = ""
authors = [{ name = "Yangxinyu", email = "xinyux@wharton.upenn.edu" }]
readme = "README.md"
dynamic = ["version"]
dependencies = ["st-pages>=1.0.1"]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel", "pip>=24.3.1,<27", "setuptools>=75.1.0,<83"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.dynamic]
version = { attr = "src.version.__version__" }

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
climrrgpt = { path = ".", editable = true }
usearch = ">=2.16.0"

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = ">=3.14.3,<3.15"
openai = ">=2.24.0,<3"
pytorch = ">=2.10.0,<3"
geopandas = ">=1.1.2,<2"
streamlit = ">=1.12.0,<2"
geopy = ">=2.4.1,<3"
plotly = ">=6.5.2,<7"
matplotlib = ">=3.10.8,<4"
rouge = ">=1.0.1,<2"
shapely = ">=2.1.2,<3"
census = ">=0.8.25,<0.9"
folium = ">=0.20.0,<0.21"
ollama = ">=0.17.5,<0.18"
contextily = ">=1.7.0,<2"
pip = ">=26.0.1,<27"
ollama-python = ">=0.6.1,<0.7"
streamlit-folium = ">=0.26.2,<0.27"
sentence-transformers = ">=5.2.3,<6"
numpy = ">=2.4.2,<3"
